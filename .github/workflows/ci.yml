name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run repo gate
        run: node tools/ci.js

      - name: Build and exercise DigitalOcean image
        run: |
          docker build -t trump-goggles-splash:ci .
          docker run --detach --rm --name trump-goggles-splash \
            --publish 127.0.0.1:8080:8080 \
            --env NODE_ENV=production \
            trump-goggles-splash:ci
          trap 'docker stop trump-goggles-splash' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:8080/api/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          node -e "const h=require('/tmp/health.json'); if(h.status!=='ok'||!(h.observability&&h.observability.canary&&h.observability.canary.status==='retired')) process.exit(1)"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/api/canary/api/v1/errors)" = 410
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8080/)" = 404